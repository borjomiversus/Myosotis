# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: |
        dotnet restore MyosotisWeb/MyosotisWeb.csproj
        dotnet restore code/projectmovies.csproj
        dotnet restore Myosotis.Tests/Myosotis.Tests.slnx

    - name: Build Projects
      run: |
        dotnet build MyosotisWeb/MyosotisWeb.csproj --no-restore
        dotnet build code/projectmovies.csproj --no-restore

    - name: Run Unit Tests
      run: dotnet test Myosotis.Tests/Myosotis.Tests.slnx --no-build --verbosity normal
